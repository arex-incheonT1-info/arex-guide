<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자주 묻는 질문 - 공항철도 이용안내</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <header>
    <a class="back-link" href="index.html">← 이용안내</a>
    <div class="brand-logo"><img src="images/arex-logo.jpg" alt="AREX 공항철도"></div>
    <h1>자주 묻는 질문</h1>
    <p>궁금한 항목을 눌러 확인하세요</p>
  </header>
  <main>
    <ul class="link-list">
      <li>
        <a class="link-btn" href="https://www.airportrailroad.com/train/express/guide" target="_blank" rel="noopener">
          <span>직통 이용 안내</span>
          <span class="icon">↗</span>
        </a>
      </li>
      <li>
        <a class="link-btn" href="https://www.airportrailroad.com/train/normal/ticket" target="_blank" rel="noopener">
          <span>일반 이용 안내</span>
          <span class="icon">↗</span>
        </a>
      </li>
      <li>
        <a class="link-btn" href="https://www.airportrailroad.com/train/express/city/info" target="_blank" rel="noopener">
          <span>도심공항 이용 안내</span>
          <span class="icon">↗</span>
        </a>
      </li>
      <li>
        <a class="link-btn" href="https://www.airport.kr/geomap/ap_ko/view.do?type=2&alertType=0&tmnlId=P01#/search" target="_blank" rel="noopener">
          <span>1터미널 시설 안내</span>
          <span class="icon">↗</span>
        </a>
      </li>
      <li>
        <details class="faq-item">
          <summary>
            <span>티머니 환불 안내</span>
            <span class="icon">›</span>
          </summary>
          <div class="faq-body">
            <img src="images/tmoney-refund.jpg" alt="티머니 환불 안내 - 편의점(GS25, CU, 세븐일레븐)에서만 가능, 환불 가능 금액 500원~30,000원">
          </div>
        </details>
      </li>
      <li>
        <details class="faq-item">
          <summary>
            <span>WOW PASS 안내</span>
            <span class="icon">›</span>
          </summary>
          <div class="faq-body">
            <img src="images/wowpass.jpg" alt="WOW PASS 이용 안내 - 1. 공항환전 신청 2. 환전금액 입금 3. 사전 안내 확인 4. 외화 수령">
          </div>
        </details>
      </li>
      <li>
        <details class="faq-item">
          <summary>
            <span>직통 하차 후 서울역 환승방법</span>
            <span class="icon">›</span>
          </summary>
          <div class="faq-body">
            <iframe src="https://www.youtube.com/embed/6LaMrRYxmfA" title="직통 하차 후 서울역 환승방법" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
          </div>
        </details>
      </li>
    </ul>
  </main>
  <footer>인천공항 ↔ 서울역 공항철도</footer>
</div>
</body>
</html>
